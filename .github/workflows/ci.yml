name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Validate plugin
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Example tests
        working-directory: examples/tasklist
        run: python3 -m unittest
